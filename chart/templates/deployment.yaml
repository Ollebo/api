apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: ollebo-api
  template:
    metadata:
      labels:
        app: ollebo-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          name: {{ .Release.Name }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ollebo-app
                key: password
          - name: API_KEY
            valueFrom:
              secretKeyRef:
                name: ollebo
                key: API_KEY
          - name: NATS
            value: nats://nats:4222
          - name: POSTGRES_DB
            value: ollebo
          - name: POSTGRES_HOST
            value: ollebo-rw
          - name: POSTGRES_USER
            value: ollebo
          # Threads borrow a connection from db.postgis's pool for the length of
          # one call. A pod costs poolMax + 1 connections (the +1 being the
          # probe connection POSTGRES_HEALTH_TIMEOUT governs); keep maxReplicas
          # x (poolMax + 1) comfortably under the cluster's max_connections (the
          # CNPG default, 100) — dw, map-maker and the rest share that budget.
          - name: POSTGRES_POOL_MAX
            value: {{ .Values.postgres.poolMax | quote }}
          - name: POSTGRES_POOL_TIMEOUT
            value: {{ .Values.postgres.poolTimeout | quote }}
          # /readyz runs on its own connection, outside the pool, so a pod with
          # every pooled connection busy still answers the probe. This bounds
          # both the connect and the SELECT 1; it must stay under the
          # readinessProbe timeoutSeconds below.
          - name: POSTGRES_HEALTH_TIMEOUT
            value: {{ .Values.postgres.healthTimeout | quote }}
          # Python buffers stdout when it is a pipe, so `kubectl logs` showed
          # nothing but the boot banner for minutes at a time — useless while
          # diagnosing a slow pod.
          - name: PYTHONUNBUFFERED
            value: "1"
          - name: PROJECT
            value: ollebo
          # Credentialed CORS allowlist. code/start.py falls back to the
          # ollebo.com hosts alone, which would block the US site's dashboard
          # from these same pods; keep this list in sync with
          # maps-proxy/charts/templates/middleware.yaml and dw's CORS_ORIGINS.
          - name: CORS_ORIGINS
            value: {{ join "," .Values.cors.origins | quote }}
          - name: REDIS_HOST
            value: {{ .Values.redis.host | quote }}
          - name: REDIS_PORT
            value: {{ .Values.redis.port | quote }}
          # Keycloak config (same KC_* vars as dw). The api derives the JWKS URL
          # from these to verify Bearer tokens; empty KC_HOST => auth disabled.
          - name: KC_HOST
            value: {{ .Values.keycloak.host | quote }}
          - name: KC_PORT
            value: {{ .Values.keycloak.port | quote }}
          - name: KC_PROTOCOL
            value: {{ .Values.keycloak.protocol | quote }}
          - name: KC_REALM
            value: {{ .Values.keycloak.realm | quote }}
          {{- if .Values.video.enabled }}
          # ollebo-video mints a per-boot RTSP endpoint, returned in the `video`
          # block of /mission/<key>/hello. Best-effort: if the video service is
          # down the handshake still succeeds, just without that block.
          - name: VIDEO_API
            value: {{ .Values.video.url | quote }}
          {{- end }}
          # Object storage for mission pictures — same S3-compatible backend and
          # AWS_* conventions as dw (Hetzner in prod). Credentials come from the
          # shared `ollebo` Secret (same keys dw reads).
          - name: AWS_ENDPOINT
            value: {{ .Values.storage.endpoint | quote }}
          - name: AWS_BUCKET
            value: {{ .Values.storage.bucket | quote }}
          - name: AWS_REGION
            value: {{ .Values.storage.region | quote }}
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: ollebo
                key: AWS_ACCESS_KEY_ID
                optional: true
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: ollebo
                key: AWS_SECRET_ACCESS_KEY
                optional: true
          # Liveness is deliberately slack: /healthz is a bare "return ok" and
          # normally answers in ~30ms, so anything slower means the gunicorn
          # threads are saturated, not that the process is wedged. Restarting a
          # merely-busy API drops every in-flight request and deepens the pile-up,
          # so allow ~60s of sustained unresponsiveness before reaching for it.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # /readyz runs SELECT 1 on a connection reserved for probes. It first
          # shared one connection with every request thread (~2.2s under load
          # against the then timeoutSeconds: 2), then a pooled one — which still
          # blocked for POSTGRES_POOL_TIMEOUT once the pool was saturated, so a
          # busy-but-healthy pod could still be pulled from the Service. Its own
          # connection decouples it from request load entirely: this now fails
          # only when Postgres is genuinely unreachable.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
